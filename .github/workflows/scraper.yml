name: Nellis Auction Monitor

on:
  push:
    branches:
      - master
      - main
  schedule:
    # Runs every day at 6 PM and 10 PM CDT (23:00 and 03:00 UTC)
    - cron: '0 3,23 * * *'
  workflow_dispatch:

jobs:
  check-auctions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip google-generativeai requests

      - name: Run Scraper
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python nellis_action.py
